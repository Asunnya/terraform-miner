# LLM classification config. Relative paths: from the repo root. Details: docs/pipeline-llm.md.

input:
  dataset_glob: "../data/dataset/**/*.jsonl"   # miner output (read-only)
  miner_config: "src/miner/config.yaml"        # keywords, for the prefilter check

output:
  directory: "src/llm_analysis/analysis_results_llm"
  prepared_commits_file: "commits_prepared.jsonl"
  store_prompts: true           # save the full user prompt in each record

experiment:
  # candidate_validation: keyword-selected commits with eligible infrastructure changes (not all raw
  # keyword-selected commits). full_classification: unfiltered corpus only.
  mode: "candidate_validation"
  input_modes:
    - message_only
    - diff_only
    - message_and_diff
  keyword_prefilter_warning_threshold: 0.95

eligibility:                    # scope filter (not a bug-fix decision), before sampling
  enabled: true
  exclude_generic_merges: true  # heuristic: the miner records have no parent count
  merge_patterns:               # matched at the start of the message, case-insensitive
    - "^Merge pull request #\\d+ from .*"
    - "^Merge remote-tracking branch '.*'"
    - "^Merge branch '.*'"
    - "^\\s*Merged in .*"
  excluded_scope_segments:      # whole directory names, any depth; the outermost one decides
    test: ["tests", "testdata", "fixtures"]
    example: ["examples", "example"]
    documentation: ["docs", "doc"]
    vendor: ["vendor"]
    generated: [".terraform"]
    repository_metadata: [".github"]
  root_only_scope_segments:     # only as the FIRST directory: test/ at the repo root is a test suite
    test: ["test"]              # (Terratest/Kitchen convention); environments/test/ stays infrastructure
  require_in_scope_patch: true  # in-scope files without any patch -> INSUFFICIENT_DATA

preparation:
  sample_size: null             # null = all commits
  seed: 42

llm:
  provider: "litellm"           # litellm | mock (fake labels, tests only)
  model: "anthropic/claude-haiku-4-5"  # "<vendor>/<model>", e.g. anthropic/claude-sonnet-5, vertex_ai/gemini-2.5-pro
  temperature: 0                # null = not sent; Claude 5 models reject any temperature (400)
  max_output_tokens: 1024       # Claude 5: raise it (adaptive thinking tokens count toward it)
  timeout_seconds: 120
  retries: 3
  retry_backoff_seconds: 2      # doubles on each retry
  workers: 1                    # concurrent requests
  api_key_env: null             # null = the vendor's usual variable (OPENAI_API_KEY, ...), from .env
  base_url: null                # local server, e.g. http://localhost:8000/v1 (hosted_vllm/<model>)
  seed: null                    # Anthropic does not accept seed
  json_mode: true
  max_tokens_param: "max_tokens"  # "max_completion_tokens" for OpenAI reasoning models
  extra_params: {}

context:                        # diff budget per commit, in characters
  max_diff_chars: 24000
  max_chars_per_file: 8000
  max_files_per_commit: 20
  max_listed_file_names: 100

classification:
  prompt_version: "v2"          # folder in prompt_templates/

evaluation:
  gold_labels: null             # adjudicated .csv/.jsonl; null = no supervised metrics
  gold_commit_column: null      # null = auto-detect
  gold_label_column: null

batch:                          # LiteLLM batch: openai, azure, vertex_ai, bedrock, hosted_vllm
  max_requests_per_batch: 50000
  max_file_mb: 190
  poll_interval_seconds: 60

pricing:                        # USD per 1M tokens, for 04_cost_report.py
  as_of: "2026-10-06"
  source: "https://developers.openai.com/api/docs/pricing, https://platform.claude.com/docs/en/about-claude/pricing"
  estimate_output_tokens: 150   # --estimate fallback when no call was made yet
  models:
    gpt-4.1-nano: {sync: {input: 0.10, output: 0.40}, batch: {input: 0.05, output: 0.20}}
    gpt-4.1-mini: {sync: {input: 0.40, output: 1.60}, batch: {input: 0.20, output: 0.80}}
    gpt-4.1:      {sync: {input: 2.00, output: 8.00}, batch: {input: 1.00, output: 4.00}}
    gpt-5.4-mini: {sync: {input: 0.75, output: 4.50}, batch: {input: 0.375, output: 2.25}}
    gpt-5.4:      {sync: {input: 2.50, output: 15.00}, batch: {input: 1.25, output: 7.50}}
    gpt-5-mini:   {sync: {input: 0.25, output: 2.00}, batch: {input: 0.125, output: 1.00}}
    gpt-5:        {sync: {input: 1.25, output: 10.00}, batch: {input: 0.625, output: 5.00}}
    o4-mini:      {sync: {input: 1.10, output: 4.40}, batch: {input: 0.55, output: 2.20}}
    claude-haiku-4-5: {sync: {input: 1.00, output: 5.00}, batch: {input: 0.50, output: 2.50}}
    claude-haiku-5-5: {sync: {input: 0.10, output: 0.50}, batch: {input: 0.05, output: 0.25}}
